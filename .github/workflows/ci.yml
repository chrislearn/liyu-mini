name: Package verification
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci-requirements.txt
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check-release-version.py
      - run: python scripts/check-bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liyu-mini-package-${{ matrix.os }}-${{ github.sha }}
          path: build/review/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified packages from all three platforms
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'liyu-mini-package-*' --dir build/artifacts
      - name: Prepare release and compare package hashes
        run: python scripts/prepare-release.py
      - name: Publish versioned package
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "礼遇小程序 $GITHUB_REF_NAME" --notes-file build/release-notes.md
